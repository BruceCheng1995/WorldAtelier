<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js 场景编辑器</title>
<style>
@font-face{font-family:AtelierCreator;src:url("/three-editor-font.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}
html,body{width:100%;height:100%;padding:0;margin:0;overflow:hidden;background:#000}
body{display:grid;place-items:center}
#surface{position:relative;width:100%;height:100%;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none;outline:0}
.control-handle{position:absolute;width:6px;height:6px;box-sizing:border-box;background:white;border:1px solid;transform:translate(-50%,-50%);pointer-events:none}
#labels,.canvas-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels span,.canvas-labels span{position:absolute;font:600 var(--wa-label-font,12px)/20px AtelierCreator,system-ui,sans-serif;height:20px;padding:0 8px;
max-width:min(224px,calc(100% - 32px));overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
border-radius:4px;background:rgba(10,18,23,.8)}
#labels>span:has(canvas),.canvas-labels>span:has(canvas){-webkit-text-fill-color:transparent}
#labels>span>canvas,.canvas-labels>span>canvas{position:absolute;top:0;left:8px;pointer-events:none}
</style></head><body><div id="surface"><canvas tabindex="0" aria-label="3D 场景编辑器"></canvas><div id="labels" aria-hidden="true"></div></div>
<script type="module" src="/three-editor-runtime.js"></script></body></html>
